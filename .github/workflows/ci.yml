name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install proto and moon
        run: |
          curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes --no-profile
          echo "$HOME/.proto/bin" >> "$GITHUB_PATH"
          echo "$HOME/.proto/shims" >> "$GITHUB_PATH"
          proto install
          moon :install
      - name: Build
        run: bun scripts/ci.sh.ts build
      - name: Check
        run: bun scripts/ci.sh.ts check
      - name: Test
        run: bun scripts/ci.sh.ts test
      - name: Smoke
        run: bun scripts/ci.sh.ts smoke
      - name: Cargo publish prep (disabled by default)
        env:
          CI_ENABLE_CARGO_PUBLISH: "false"
        run: bun scripts/ci.sh.ts cargo-publish-prep

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build CI container and run smoke
        run: bun scripts/ci.sh.ts docker-smoke

  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Render snapshot review HTML
        run: bun scripts/ci.sh.ts snapshots
      - name: Upload snapshot review HTML
        uses: actions/upload-artifact@v4
        with:
          name: tinyverse-ui-snapshot-review-html
          path: docs/examples/tinyverse_ui/snapshot_reviews/20260216-225543/index.html
      - name: Upload full snapshot review folder
        uses: actions/upload-artifact@v4
        with:
          name: tinyverse-ui-snapshot-review-bundle
          path: docs/examples/tinyverse_ui/snapshot_reviews/20260216-225543

  binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        env:
          CI_ARTIFACT_DIR: ci-artifacts/${{ runner.os }}-${{ runner.arch }}
        run: bun scripts/ci.sh.ts binaries
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyverse-cli-${{ runner.os }}-${{ runner.arch }}
          path: ci-artifacts/${{ runner.os }}-${{ runner.arch }}

  docker-publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container images
        env:
          CI_DOCKER_IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            bun scripts/docker_publish.sh.ts --push --image-repo "$CI_DOCKER_IMAGE_REPO" --tag "sha-${SHORT_SHA}" --tag latest --platforms linux/amd64,linux/arm64
          else
            bun scripts/docker_publish.sh.ts --push --image-repo "$CI_DOCKER_IMAGE_REPO" --tag "sha-${SHORT_SHA}" --platforms linux/amd64,linux/arm64
          fi
