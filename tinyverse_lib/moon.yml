$schema: "https://moonrepo.dev/schemas/project.json"

language: "rust"
stack: "backend"
type: "library"

tasks:
  install:
    command: "cargo fetch"

  build:
    command: "cargo build"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  check:
    command: "cargo check"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  test:
    command: "sh"
    args: ["-c", "cargo nextest run || cargo test"]
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  db_setup:
    command: "sh"
    args:
      [
        "-c",
        "mkdir -p ../.tinyverse && DATABASE_URL=../.tinyverse/tinyverse_sessions.sqlite3 diesel setup --migration-dir migrations --config-file diesel.toml",
      ]

  db_migrate:
    command: "sh"
    args:
      [
        "-c",
        "mkdir -p ../.tinyverse && DATABASE_URL=../.tinyverse/tinyverse_sessions.sqlite3 diesel migration run --migration-dir migrations --config-file diesel.toml",
      ]

  db_generate_migration:
    command: "sh"
    args:
      [
        "-c",
        "mkdir -p ../.tinyverse && DATABASE_URL=../.tinyverse/tinyverse_sessions.sqlite3 diesel migration generate",
      ]
