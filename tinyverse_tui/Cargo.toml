[package]
name = "tinyverse_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.101", features = ["backtrace"] }
crossterm = "0.29.0"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0.149"
tinyverse_lib = { path = "../tinyverse_lib" }

[dev-dependencies]
chrono = "0.4.42"
insta = "1.46.3"
