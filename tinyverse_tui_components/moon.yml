$schema: "https://moonrepo.dev/schemas/project.json"

language: "rust"
stack: "backend"
type: "library"

tasks:
  install:
    command: "cargo fetch"

  build:
    command: "cargo build -p tinyverse_tui_components"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  check:
    command: "cargo check -p tinyverse_tui_components"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  test:
    command: "sh"
    args: ["-c", "cargo nextest run -p tinyverse_tui_components || cargo test -p tinyverse_tui_components"]
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
