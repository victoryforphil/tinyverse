$schema: "https://moonrepo.dev/schemas/project.json"

language: "rust"
stack: "backend"
type: "application"
dependsOn:
  - "tinyverse_lib"

tasks:
  install:
    command: "cargo fetch"

  build:
    command: "cargo build"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  check:
    command: "cargo check"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  test:
    command: "bun"
    args: ["./scripts/helpers/test_rust.sh.ts"]
    inputs:
      - "src/**/*"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
