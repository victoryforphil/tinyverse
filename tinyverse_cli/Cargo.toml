[package]
name = "tinyverse_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.101", features = ["backtrace"] }
clap = { version = "4.5.59", features = ["derive", "env"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tinyverse_lib = { path = "../tinyverse_lib" }
tinyverse_tui = { path = "../tinyverse_tui" }
tinyverse_ui = { path = "../tinyverse_ui" }
toml = "1.0.2"
tracing = { version = "0.1.44", features = ["log"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
